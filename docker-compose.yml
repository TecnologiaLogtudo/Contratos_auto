services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: contratos-app
    ipc: host
    security_opt:
      - seccomp=./backend/seccomp-playwright.json
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PLAYWRIGHT_HEADLESS=true
      - ADMIN_RESET_PASSWORD=${ADMIN_RESET_PASSWORD}
      - BASE_PATH=/contratos
    volumes:
      - app_data:/app/backend/app/data
    expose:
      - "8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.logtudo-contratos.rule=Host(`automacao.logtudo.com.br`) && PathPrefix(`/contratos`)
      - traefik.http.routers.logtudo-contratos.entrypoints=http,https
      - traefik.http.routers.logtudo-contratos.middlewares=logtudo-contratos-strip
      - traefik.http.middlewares.logtudo-contratos-strip.stripprefix.prefixes=/contratos
      - traefik.http.services.logtudo-contratos.loadbalancer.server.port=8000
      - coolify.managed=true
      - coolify.proxy=true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  app_data:
