services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: contratos-backend
    ipc: host
    init: true
    security_opt:
      - seccomp=./backend/seccomp-playwright.json
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - PLAYWRIGHT_HEADLESS=true
      - PLAYWRIGHT_BROWSER_CHANNEL=${PLAYWRIGHT_BROWSER_CHANNEL:-chrome}
      - ADMIN_RESET_PASSWORD=${ADMIN_RESET_PASSWORD:-}
      - BASE_PATH=${BASE_PATH:-/contratos}
      - AUTOMACAO_LOGIN=${AUTOMACAO_LOGIN:-}
      - AUTOMACAO_SENHA=${AUTOMACAO_SENHA:-}
      - AUTOMACAO_ATRASOFASES=${AUTOMACAO_ATRASOFASES:-0.5}
      - AUTOMACAO_ATRASOETAPAS=${AUTOMACAO_ATRASOETAPAS:-0.15}
      - AUTOMACAO_DADOS_KM=${AUTOMACAO_DADOS_KM:-20}
      - AUTOMACAO_ACEITAR_FRETE_MINIMO=${AUTOMACAO_ACEITAR_FRETE_MINIMO:-True}
    volumes:
      - app_data:/app/backend/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/contratos/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/contratos}
    container_name: contratos-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/contratos/health/ready | grep -q '\"status\":\"ready\"'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  app_data:
